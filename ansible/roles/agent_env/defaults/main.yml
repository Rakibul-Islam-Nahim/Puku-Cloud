---
agent_env_file: /etc/pukucloud/env.agent

# Fleet-wide, non-secret knobs this role is allowed to manage.
agent_env_managed:
  PUKUCLOUD_STREAM_RESTORE: "1"
  PUKUCLOUD_HUGEPAGES: "1"
  PUKUCLOUD_NATID: "1"
  PUKUCLOUD_NATID_POOL_SIZE: "24"

# Hard guard: keys this role must NEVER write (secrets + per-host identity).
# If a managed key ever collides with this list the play fails loudly.
agent_env_denylist:
  - PUKUCLOUD_DB_DSN
  - PUKUCLOUD_DB_DRIVER
  - PUKUCLOUD_NODE_TOKEN
  - PUKUCLOUD_SHARED_KEY
  - SUPABASE_JWKS_URL
  - CLICKHOUSE_URL
  - PUKUCLOUD_CLICKHOUSE_URL
  - PUKUCLOUD_AGENT_ID
  - PUKUCLOUD_AGENT_ENDPOINT
  - PUKUCLOUD_REGION
  - PUKUCLOUD_ZONE
  - PUKUCLOUD_INTERNAL_IP
  - PUKUCLOUD_GCS_BUCKET
  - PUKUCLOUD_NATID_SLOT
