# Local development stack for PukuCloud self-hosters.
#
# Brings up: Temporal (workflow orchestration), Sentry (error monitoring),
# agent (data plane — needs /dev/kvm), and dashboard (web UI).
#
# This stack REPLACES the previous PostgreSQL+ClickHouse setup. The new
# architecture uses:
#   - Temporal for workflow orchestration (replaces the PostgreSQL scheduler)
#   - Sentry for error monitoring (replaces in-house metrics-only setup)
#   - D1 (Cloudflare) for historical records (when running the CF control plane)
#   - Durable Objects (Cloudflare) for live per-worker state
#
# Does NOT bring up PostgreSQL — there is no control-plane DB anymore.
# The Cloudflare Worker stores history in D1.
#
# Usage:
#   docker compose up -d
#   # then on the host (Linux with KVM):
#   ./agent --listen-tcp :7070
#   export PUKUCLOUD_AGENT_URL=http://host.docker.internal:7070
#
# Tear down: docker compose down -v

name: pukucloud-dev

services:
  # ---- Orchestration --------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.22.5
    container_name: pukucloud-temporal
    environment:
      DB: postgresql
      POSTGRES_HOST: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
      TEMPORAL_CLI_DEFAULT_NAMESPACE: default
      VISIBILITY_TTL: "168h"
    ports:
      - "7233:7233"   # gRPC frontend (workers + clients)
      - "8233:8233"   # HTTP API (web UI + CF Worker)
    depends_on:
      temporal-postgres:
        condition: service_healthy

  temporal-postgres:
    image: postgres:16-alpine
    container_name: pukucloud-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Error monitoring -----------------------------------------------------
  sentry:
    image: getsentry/sentry:24.5.1
    container_name: pukucloud-sentry
    depends_on:
      sentry-postgres:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    environment:
      SENTRY_SECRET_KEY: "${SENTRY_SECRET_KEY:-REPLACE_WITH_openssl_rand_hex_32}"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis
      SENTRY_SINGLE_ORGANIZATION: "true"
    command: ["run", "web"]
    ports:
      - "9000:9000"

  sentry-worker:
    image: getsentry/sentry:24.5.1
    container_name: pukucloud-sentry-worker
    depends_on:
      sentry-postgres:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    environment:
      SENTRY_SECRET_KEY: "${SENTRY_SECRET_KEY:-REPLACE_WITH_openssl_rand_hex_32}"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis
    command: ["run", "worker"]

  sentry-cron:
    image: getsentry/sentry:24.5.1
    container_name: pukucloud-sentry-cron
    depends_on:
      sentry-postgres:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    environment:
      SENTRY_SECRET_KEY: "${SENTRY_SECRET_KEY:-REPLACE_WITH_openssl_rand_hex_32}"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis
    command: ["run", "cron"]

  sentry-postgres:
    image: postgres:16-alpine
    container_name: pukucloud-sentry-postgres
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
      POSTGRES_DB: sentry
    volumes:
      - sentry_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry"]
      interval: 5s
      timeout: 3s
      retries: 20

  sentry-redis:
    image: redis:7-alpine
    container_name: pukucloud-sentry-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Agent (data plane) ---------------------------------------------------
  # Runs the Go agent that launches Firecracker microVMs. Needs /dev/kvm
  # and privileged mode for tap devices. NOT in the Go API path — workers
  # poll Temporal directly.
  agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    image: pukucloud/agent:latest
    container_name: pukucloud-agent
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./data:/var/lib/pukucloud
      - /var/run/pukucloud:/var/run/pukucloud
    environment:
      - PUKUCLOUD_AGENT_LISTEN=0.0.0.0:9090
      - PUKUCLOUD_DATA_DIR=/var/lib/pukucloud
      - PUKUCLOUD_METRICS_LISTEN=0.0.0.0:9100
      # Temporal connection
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=pukucloud-microvms
      # Sentry
      - SENTRY_DSN=${SENTRY_DSN:-}
      - PUKUCLOUD_ENV=development
      - PUKUCLOUD_WORKER_ID=agent-dev
    ports:
      - "9090:9090"
      - "9100:9100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      temporal:
        condition: service_started

  # ---- Dashboard ------------------------------------------------------------
  # The Next.js dashboard. Calls the Cloudflare Worker for live state.
  # Locally, point it at a locally-running CF Worker (`wrangler dev`).
  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
    environment:
      - NEXT_PUBLIC_PUKUCLOUD_API=http://localhost:8787
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  temporal_pg_data:
  sentry_pg_data:
