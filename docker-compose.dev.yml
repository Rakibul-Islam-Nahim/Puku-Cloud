# PukuCloud on Linux+KVM — single host self-host.
#
# Usage:
#   1. Host must be Linux x86_64/arm64 with /dev/kvm available.
#   2. Drop a Firecracker kernel at ./data/kernels/vmlinux-aarch64 (or x86_64).
#   3. Drop at least one template at ./data/templates/<name>/{rootfs.ext4,kernel}.
#   4. docker compose -f docker-compose.dev.yml up -d
#   5. Open http://localhost:3000
#
# This is the minimal self-hosted composition. Production deployments
# should split agent onto separate hosts, add TLS + reverse proxy,
# provision managed Temporal + Sentry (or larger self-hosted ones).

services:
  temporal:
    image: temporalio/auto-setup:1.22.5
    container_name: pukucloud-temporal
    environment:
      DB: postgresql
      POSTGRES_HOST: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
      TEMPORAL_CLI_DEFAULT_NAMESPACE: default
      VISIBILITY_TTL: "168h"
    ports:
      - "7233:7233"
      - "8233:8233"
    depends_on:
      temporal-postgres:
        condition: service_healthy

  temporal-postgres:
    image: postgres:16-alpine
    container_name: pukucloud-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  sentry:
    image: getsentry/sentry:24.5.1
    container_name: pukucloud-sentry
    depends_on:
      sentry-postgres:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    environment:
      SENTRY_SECRET_KEY: "${SENTRY_SECRET_KEY:-REPLACE_WITH_openssl_rand_hex_32}"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis
      SENTRY_SINGLE_ORGANIZATION: "true"
    command: ["run", "web"]
    ports:
      - "9000:9000"

  sentry-worker:
    image: getsentry/sentry:24.5.1
    container_name: pukucloud-sentry-worker
    depends_on:
      sentry-postgres:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    environment:
      SENTRY_SECRET_KEY: "${SENTRY_SECRET_KEY:-REPLACE_WITH_openssl_rand_hex_32}"
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: sentry-redis
    command: ["run", "worker"]

  sentry-postgres:
    image: postgres:16-alpine
    container_name: pukucloud-sentry-postgres
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
      POSTGRES_DB: sentry
    volumes:
      - sentry_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry"]
      interval: 5s
      timeout: 3s
      retries: 20

  sentry-redis:
    image: redis:7-alpine
    container_name: pukucloud-sentry-redis

  agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    image: pukucloud/agent:latest
    container_name: pukucloud-agent
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./data:/var/lib/pukucloud
      - /var/run/pukucloud:/var/run/pukucloud
    environment:
      - PUKUCLOUD_AGENT_LISTEN=0.0.0.0:9090
      - PUKUCLOUD_DATA_DIR=/var/lib/pukucloud
      - PUKUCLOUD_METRICS_LISTEN=0.0.0.0:9100
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=pukucloud-microvms
      - SENTRY_DSN=${SENTRY_DSN:-}
      - PUKUCLOUD_ENV=development
    ports:
      - "9090:9090"
      - "9100:9100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      temporal:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: pukucloud-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/monitoring/otel-collector/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: pukucloud-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pukucloud-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/pukucloud.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3030:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  temporal_pg_data:
  sentry_pg_data:
