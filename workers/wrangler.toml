name = "pukucloud-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ---- Observability ------------------------------------------------------------
[observability]
enabled = true

# ---- Vars ---------------------------------------------------------------------
# Public, non-secret. Override per-env below.
[vars]
PUKUCLOUD_ENV = "production"
PUKUCLOUD_API_VERSION = "0.1.0"
# Agents reachable from Workers — comma-separated host:port for multi-node.
# LEGACY: kept for the temporary fallback proxy. New code talks to Temporal,
# not directly to agents.
PUKUCLOUD_AGENT_URLS = "https://agent-1.internal.example.com:9090,https://agent-2.internal.example.com:9090"
# Edge entrypoint the dashboard / clients call.
PUKUCLOUD_DASHBOARD_URL = "https://dashboard.example.com"

# ---- Temporal (self-hosted) ----------------------------------------------------
# The controller starts / signals / queries workflows here. Workers (Go agents)
# poll Temporal for activities. There are no worker IPs in the controller.
TEMPORAL_ADDRESS = "http://temporal:8233"
TEMPORAL_NAMESPACE = "default"
TEMPORAL_TASK_QUEUE = "pukucloud-microvms"
# TEMPORAL_AUTH_TOKEN set via `wrangler secret put TEMPORAL_AUTH_TOKEN`

# ---- Sentry (self-hosted) ------------------------------------------------------
# SENTRY_DSN set via `wrangler secret put SENTRY_DSN`
# Format: https://<public_key>@<host>/<project_id>
# Example for self-hosted Sentry at https://sentry.example.com project 1:
#   SENTRY_DSN = "https://abc123@sentry.example.com/1"

# ---- D1 (control-plane state) -------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "pukucloud-db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# ---- R2 (snapshot / seed / UFFD / NBD store) ----------------------------------
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "pukucloud-snapshots"
# Optional: a second bucket for templates only.
# [[r2_buckets]]
# binding = "TEMPLATES"
# bucket_name = "pukucloud-templates"

# ---- KV (rate limiting, JWT cache, NAT-ID fast-path) -------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"

# ---- Durable Object: per-worker live state -----------------------------------
# One DO instance per agent host. Agents write state on heartbeats; the
# controller reads state for the dashboard.
# Run `wrangler deploy` once first; wrangler will create the class, then
# re-deploy to bind it.
[[durable_objects.bindings]]
name = "WORKER_STATE_DO"
class_name = "WorkerStateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkerStateDO"]

# ---- Secrets (set with `wrangler secret put ...`) -----------------------------
# PUKUCLOUD_AGENT_TOKEN       — bearer shared with agents
# PUKUCLOUD_ADMIN_TOKEN       — bootstrap admin token
# SUPABASE_JWKS_URL            — JWKS endpoint (or empty to disable JWT auth)
# SUPABASE_ISSUER              — expected `iss` claim
# SUPABASE_AUDIENCE            — expected `aud` claim
# CLICKHOUSE_URL               — ClickHouse Cloud HTTPS endpoint
# CLICKHOUSE_USER
# CLICKHOUSE_PASSWORD
# R2_SNAPSHOT_TOKEN            — optional signed-token for R2 Range GETs
# CLOUDFLARE_API_TOKEN         — only if we need to manage DNS at request-time

# ---- Service bindings (optional) ---------------------------------------------
# [[services]]
# binding = "DOCS"
# service = "pukucloud-docs"

# ---- Custom domains -----------------------------------------------------------
# routes = [
#   { pattern = "api.example.com/*", custom_domain = true },
# ]

# =============================================================================
# Per-environment overrides
# =============================================================================

[env.staging]
name = "pukucloud-api-staging"
[env.staging.vars]
PUKUCLOUD_ENV = "staging"
PUKUCLOUD_DASHBOARD_URL = "https://staging.dashboard.example.com"
PUKUCLOUD_AGENT_URLS = "https://agent-staging.internal.example.com:9090"
[env.staging.d1_databases]
binding = "DB"
database_name = "pukucloud-db-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"

[env.production]
name = "pukucloud-api"
[env.production.vars]
PUKUCLOUD_ENV = "production"
